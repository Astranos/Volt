<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,Arial);color:var(--foreground,#dce8df)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}button{font:inherit;font-size:13px;border:1px solid var(--border,#354339);border-radius:8px;background:transparent;color:inherit;padding:10px 12px;cursor:pointer;min-height:42px}button[aria-selected=true]{background:#163d24;border-color:#53bb70;color:#a4f5ba}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:8px}figcaption{font-size:13px;color:var(--muted-foreground,#9eafa3);line-height:1.5;margin-top:12px}.meta{font-size:12px;opacity:.65;margin:12px 0 0}</style></head><body><nav role="tablist" aria-label="Canva screenshot exports"><button role="tab" id="t0" aria-controls="p0" aria-selected="true">Inventory</button><button role="tab" id="t1" aria-controls="p1" aria-selected="false">UPC menu</button><button role="tab" id="t2" aria-controls="p2" aria-selected="false">Quick actions</button><button role="tab" id="t3" aria-controls="p3" aria-selected="false">Offers</button><button role="tab" id="t4" aria-controls="p4" aria-selected="false">Compare</button></nav><figure id="p0" role="tabpanel" aria-labelledby="t0" ><img src="screenshots/01-inventory.png" width="1280" height="800" alt="Inventory Canva screenshot export"><figcaption>Real Volt inventory UI with demo stock and square product photos.</figcaption></figure><figure id="p1" role="tabpanel" aria-labelledby="t1" hidden><img src="screenshots/02-upc-research.png" width="1280" height="800" alt="UPC menu Canva screenshot export"><figcaption>The actual Volt UPC menu on a public product page.</figcaption></figure><figure id="p2" role="tabpanel" aria-labelledby="t2" hidden><img src="screenshots/03-quick-actions.png" width="1280" height="800" alt="Quick actions Canva screenshot export"><figcaption>Selected text and the actual Volt right-click menu.</figcaption></figure><figure id="p3" role="tabpanel" aria-labelledby="t3" hidden><img src="screenshots/04-offer-calculator.png" width="1280" height="800" alt="Offers Canva screenshot export"><figcaption>The actual Offer Calculator with a $400 projected sale.</figcaption></figure><figure id="p4" role="tabpanel" aria-labelledby="t4" hidden><img src="screenshots/05-product-comparison.png" width="1280" height="800" alt="Compare Canva screenshot export"><figcaption>Real comparison UI with matching model photos and demo inventory.</figcaption></figure><p class="meta">5 Canva PNG exports · 1280 × 800 · Inter Regular · 1:1 product photos</p><script>const tabs=[...document.querySelectorAll('[role=tab]')];function choose(i){tabs.forEach((t,j)=>t.setAttribute('aria-selected',String(i===j)));document.querySelectorAll('figure').forEach((p,j)=>p.hidden=i!==j)}tabs.forEach((t,i)=>{t.onclick=()=>choose(i);t.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){let n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;choose(n);tabs[n].focus()}}});console.log('Ready: five Canva exports');</script></body></html>
