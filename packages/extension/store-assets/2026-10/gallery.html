<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,Arial);color:var(--foreground,#dce8df)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}button{font:inherit;font-size:13px;border:1px solid var(--border,#354339);border-radius:8px;background:transparent;color:inherit;padding:10px 12px;cursor:pointer;min-height:42px}button[aria-selected=true]{background:#163d24;border-color:#53bb70;color:#a4f5ba}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:10px}figcaption{font-size:13px;color:var(--muted-foreground,#9eafa3);line-height:1.5;margin-top:12px}.meta{font-size:12px;opacity:.65;margin:12px 0 0}</style></head><body><nav role="tablist" aria-label="Chrome Web Store screenshots"><button role="tab" id="tab-0" aria-controls="panel-0" aria-selected="true" data-index="0">Inventory</button><button role="tab" id="tab-1" aria-controls="panel-1" aria-selected="false" data-index="1">UPC shortcuts</button><button role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" data-index="2">Offers</button><button role="tab" id="tab-3" aria-controls="panel-3" aria-selected="false" data-index="3">iPhone capture</button><button role="tab" id="tab-4" aria-controls="panel-4" aria-selected="false" data-index="4">Handbook</button></nav><figure role="tabpanel" id="panel-0" aria-labelledby="tab-0" ><img src="screenshots/01-inventory.png" width="1280" height="800" alt="Volt Chrome Web Store screenshot: Inventory"><figcaption>Search Shopify inventory and select products to compare.</figcaption></figure><figure role="tabpanel" id="panel-1" aria-labelledby="tab-1" hidden><img src="screenshots/02-upc-research.png" width="1280" height="800" alt="Volt Chrome Web Store screenshot: UPC shortcuts"><figcaption>Copy a highlighted UPC or open a pricing lookup.</figcaption></figure><figure role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden><img src="screenshots/03-offer-calculator.png" width="1280" height="800" alt="Volt Chrome Web Store screenshot: Offers"><figcaption>See suggested and maximum offers for a $400 projected sale.</figcaption></figure><figure role="tabpanel" id="panel-3" aria-labelledby="tab-3" hidden><img src="screenshots/04-iphone-scanner.png" width="1280" height="800" alt="Volt Chrome Web Store screenshot: iPhone capture"><figcaption>The companion iPhone app alongside Chrome’s scanner history.</figcaption></figure><figure role="tabpanel" id="panel-4" aria-labelledby="tab-4" hidden><img src="screenshots/05-store-handbook.png" width="1280" height="800" alt="Volt Chrome Web Store screenshot: Handbook"><figcaption>Copy store details and keep logins and guides close.</figcaption></figure><p class="meta">5 upload-ready PNGs · 1280 × 800 · Real UI with sample data</p><script>const tabs=[...document.querySelectorAll('[role=tab]')];function select(i){tabs.forEach((t,j)=>t.setAttribute('aria-selected',String(i===j)));document.querySelectorAll('figure').forEach((p,j)=>p.hidden=i!==j)}tabs.forEach((t,i)=>{t.addEventListener('click',()=>select(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;select(n);tabs[n].focus()}})});console.log('Gallery ready: '+tabs.length+' screenshots');</script></body></html>
