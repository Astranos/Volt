<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Reconnect to Volt</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fafafa; color: #09090b; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #e4e4e7; border-radius: 24px; background: white; }
      .brand { color: #15803d; font-size: 14px; font-weight: 700; }
      h1 { margin-top: 24px; font-size: 28px; letter-spacing: -1px; }
      p { color: #52525b; line-height: 1.65; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #09090b; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #34c759; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">VOLT WORKSPACE</span>
      <h1>You're offline.</h1>
      <p>Connect to the internet to load your captures, search product data, and manage your account. Volt does not store your workspace data for offline use.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
